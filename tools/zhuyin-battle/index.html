<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>注音打怪獸</title>
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="stylesheet" href="../../shared/battle.css">
<link rel="stylesheet" href="../../shared/levels.css">
<script src="../../shared/sound.js"></script>
<script src="../../shared/music.js"></script>
<script src="../../shared/zhuyin.js"></script>
<script src="../../shared/icons.js"></script>
<script src="../../shared/battle.js"></script>
<script src="../../shared/levels.js"></script>
<script src="../../shared/firebase-config.js"></script>
<script type="module" src="../../shared/cloud.js"></script>
<script src="bank.js"></script>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:#141a3a; color:#1d2340; user-select:none; font-family:var(--font); }
  .screen { display:none; min-height:100%; max-width:780px; margin:0 auto; }
  .screen.on { display:block; }
  #battle { padding:0 10px; background:linear-gradient(#2a3a8a, #141a3a); }
  button { font-family:inherit; cursor:pointer; }

  /* 題目框裡的樣式 */
  .zq-prompt { font-size:clamp(1.45rem,5.6vw,2rem); font-weight:900; color:#1d2340; line-height:1.5; }
  .zq-pic { font-size:clamp(2.8rem,12vw,3.8rem); line-height:1.15; margin-top:2px; }
  .zq-pic .ic.big { width:1.6em; height:1.6em; }
  .bt-choices .ic { width:clamp(56px,13vw,84px); height:clamp(56px,13vw,84px); }
  .zq-pick .ic { width:clamp(46px,11vw,68px); height:clamp(46px,11vw,68px); }
  .zq-word { font-size:1.1rem; color:#5a6890; font-weight:700; }
  .zq-zy { font-size:clamp(2.4rem,11vw,3.4rem); font-weight:900; color:#1d2340; letter-spacing:.08em; line-height:1.2; margin-top:4px; }
  .zq-blank { display:inline-block; min-width:1em; color:#e05555; border-bottom:4px solid #e05555; }
  .zq-emoji { font-size:clamp(2.4rem,11vw,3.2rem); line-height:1; }
  .zq-tone { display:inline-block; min-width:1em; margin-right:6px; color:#d06020; }
  .bt-choices button:has(.zq-tone) { font-size:clamp(1.5rem,6.5vw,2rem); }
  .zq-pick { display:flex; flex-direction:column; align-items:center; line-height:1; }
  .zq-pick small { font-size:1.1rem; color:#5a6890; margin-top:4px; }
  .bt-choices button.right .zq-pick small { color:#fff; }
</style>
</head>
<body>

<!-- 開始：輸入名字 -->
<section class="screen on" id="start"></section>

<!-- 關卡地圖 -->
<section class="screen" id="map"></section>

<!-- 排行榜 -->
<section class="screen" id="board"></section>

<!-- 對戰（畫面由 shared/battle.js 產生）-->
<section class="screen" id="battle"></section>

<script>
const BASE = '../../';            // 回到專案根目錄
const GAME_ID = 'zhuyin-battle';  // 存紀錄用
const TITLE = 'ㄅ 注音打怪獸';
const LEVELS = ZhuyinBank.levels();
const $ = id => document.getElementById(id);
let playerName = '';
let backTo = 'start';             // 排行榜按「返回」要回到哪裡

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }

function showStart() {
  show('start');
  Levels.renderStart($('start'), {
    gameId: GAME_ID, title: '注音打怪獸', homeHref: BASE, base: BASE,
    subtitle: '康軒首冊 9 課＋魔王關，一關一隻怪獸！',
    onStart: name => { playerName = name; showMap(); },
    onBoard: () => showBoard('start'),
  });
}

function showMap() {
  show('map');
  Levels.renderMap($('map'), {
    gameId: GAME_ID, name: playerName, base: BASE, levels: LEVELS, title: TITLE,
    onPick: startLevel,
    onSwitch: showStart,
    // 錯題複習：只出這位玩家答錯過的題目
    onReview: () => {
      show('battle');
      Levels.startReview({
        game: GAME_ID, player: playerName, root: $('battle'), base: BASE, moves: ['注音光線', '拼音飛踢', '聲調光波', '火焰拳', '光之斬擊'],
        speech: q => q.speech, answerText: q => q.answerText, onExit: showMap,
      }).then(ok => { if (!ok) showMap(); });
    },
    onBoard: () => showBoard('map'),
  });
}

function showBoard(from) {
  backTo = from;
  show('board');
  Levels.renderBoard($('board'), {
    gameId: GAME_ID, title: TITLE, name: playerName,
    onBack: () => backTo === 'map' ? showMap() : showStart(),
  });
}

function startLevel(i) {
  show('battle');
  Battle.start({
    root: $('battle'),
    level: { no: i + 1, title: LEVELS[i].title, monster: Levels.monster(i, BASE), rules: Levels.TIMING[i] },
    player: Levels.player(BASE, ['注音光線', '拼音飛踢', '聲調光波', '火焰拳', '光之斬擊'], playerName, Levels.getPlayer(GAME_ID, playerName).best + 1),
    nextQuestion: last => ZhuyinBank.question(i + 1, last),
    renderQuestion: (q, el) => { el.innerHTML = q.html; },
    speech: q => q.speech,
    answerText: q => q.answerText,
    background: Levels.scene(i, BASE),   // 每一關有自己的場景
    hasNext: i < LEVELS.length - 1,
    isLast: i === LEVELS.length - 1,
    // 每場打完都記錄，結算畫面附上排行榜
    onEnd: r => Levels.recordResult(GAME_ID, playerName, i + 1, r, LEVELS.length),
    // 答錯就記到答錯清單（家長專區可以看，錯題複習會再出）
    onWrong: (q, chosen, chosenText) => Levels.recordWrong(GAME_ID, playerName, i + 1, q, chosen, chosenText, `${q.type}:${q.word}`),
    overExtra: () => `<div class="lb-title">🏆 排行榜</div>${Levels.boardHtml(GAME_ID, playerName, 5)}`,
    onNext: () => startLevel(i + 1),
    onExit: showMap,
  });
}

showStart();
</script>
</body>
</html>
