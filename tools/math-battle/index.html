<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>數學打怪獸</title>
<link rel="stylesheet" href="../../shared/ui.css">
<link rel="stylesheet" href="../../shared/battle.css">
<link rel="stylesheet" href="../../shared/levels.css">
<script src="../../shared/sound.js"></script>
<script src="../../shared/music.js"></script>
<script src="../../shared/zhuyin.js"></script>
<script src="../../shared/icons.js"></script>
<script src="../../shared/battle.js"></script>
<script src="../../shared/levels.js"></script>
<script src="../../shared/firebase-config.js"></script>
<script type="module" src="../../shared/cloud.js"></script>
<script src="bank.js"></script>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:#141a3a; color:#1d2340; user-select:none; font-family:var(--font); }
  .screen { display:none; min-height:100%; max-width:780px; margin:0 auto; }
  .screen.on { display:block; }
  #battle { padding:0 10px; background:linear-gradient(#2a3a8a, #141a3a); }
  button { font-family:inherit; cursor:pointer; }

  /* ===== 題目框裡的樣式 ===== */
  .mq-prompt { font-size:clamp(1.4rem,5.4vw,1.95rem); font-weight:900; color:#1d2340; line-height:1.5; }
  .mq-big { font-size:clamp(2.4rem,11vw,3.4rem); font-weight:900; color:#1d2340; line-height:1.15; letter-spacing:.04em; }
  .mq-big .q, .mq-split .q { color:#e8443a; }
  .mq-emoji { font-size:clamp(2.2rem,10vw,3rem); line-height:1; }
  .mq-emoji.big { font-size:clamp(3.4rem,15vw,4.6rem); margin-top:4px; }
  .mq-center { margin-top:6px; }

  /* 一堆東西：每 5 個一組 */
  .mq-pile { display:flex; flex-wrap:wrap; justify-content:center; gap:4px 12px; margin-top:6px; font-size:clamp(1.5rem,6vw,2.1rem); line-height:1.1; }
  .mq-five { display:inline-flex; gap:1px; }
  .mq-five i { font-style:normal; position:relative; }
  .mq-five i.gone { opacity:.35; }
  .mq-five i.gone::after { content:"✕"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#e8443a; font-weight:900; }
  .mq-empty { font-size:3rem; }
  .mq-pile .ic { width:1.65em; height:1.65em; }
  .mq-row .ic { width:1.7em; height:1.7em; }
  .mq-center .ic.big { width:clamp(90px,22vw,130px); height:clamp(90px,22vw,130px); }
  .bt-choices .ic.ch { width:clamp(52px,12vw,76px); height:clamp(52px,12vw,76px); }
  .mq-two { display:flex; flex-direction:column; gap:4px; align-items:center; margin-top:4px; }
  .mq-two > div { display:flex; align-items:center; gap:8px; }
  .mq-two > div > b { font-size:1rem; color:#5a6890; min-width:2.6em; text-align:right; }
  .mq-two > div .mq-pile { margin-top:0; justify-content:flex-start; }
  .mq-two.row { flex-direction:row; flex-wrap:wrap; justify-content:center; gap:4px 10px; }
  .mq-two.row em { font-style:normal; font-size:2rem; font-weight:900; color:#5a6890; }

  /* 選項裡的圓點、色塊、形狀 */
  .mq-dots { font-size:clamp(.9rem,3.6vw,1.25rem); letter-spacing:.05em; color:#2f7de1; max-width:5.6em; line-height:1.25; word-break:break-all; text-align:center; }
  .mq-swatch { display:inline-block; width:1em; height:1em; border-radius:6px; background:var(--c); margin-right:6px; border:2px solid #1d2340; vertical-align:-.1em; }
  .bt-choices button:has(.mq-swatch), .bt-choices button:has(small) { font-size:clamp(1.3rem,5.2vw,1.7rem); }
  .bt-choices button small { display:block; font-size:1rem; margin-top:2px; }
  .bt-choices button:has(small) .bt-c { display:flex; flex-direction:column; align-items:center; }
  .mq-shape { stroke:#1d2340; stroke-width:4; }

  /* 長條（比長短） */
  .mq-bars { display:flex; flex-direction:column; gap:8px; align-items:flex-start; margin:8px auto 0; width:min(100%, 440px); }
  .mq-bar { height:24px; width:calc(var(--w) * 10%); background:var(--c); border:3px solid #1d2340; border-radius:6px; display:flex; }
  .mq-bar b { flex:1; border-right:2px solid rgba(255,255,255,.85); }
  .mq-bar b:last-child { border-right:0; }

  /* 順序：一排動物 */
  .mq-row { display:flex; justify-content:center; align-items:center; gap:4px; font-size:clamp(1.8rem,7.5vw,2.6rem); margin-top:6px; }
  .mq-row i { font-style:normal; }
  .mq-row em { font-style:normal; font-size:.8em; }

  /* 分與合 */
  .mq-split { display:flex; align-items:center; justify-content:center; gap:14px; font-size:clamp(2rem,9vw,2.8rem); font-weight:900; margin-top:4px; }
  .mq-whole { display:inline-flex; align-items:center; justify-content:center; width:1.8em; height:1.8em; border-radius:50%; background:#ffe066; border:3px solid #1d2340; }
  .mq-parts { display:flex; gap:10px; }
  .mq-parts span { display:inline-flex; align-items:center; justify-content:center; width:1.6em; height:1.6em; border-radius:12px; background:#dff1ff; border:3px solid #1d2340; }
  .mq-dotline { color:#2f7de1; font-size:1.3rem; letter-spacing:.1em; margin-top:4px; }
  .mq-dotline .faint { color:#b8c6dc; }
  .mq-frame { display:grid; grid-template-columns:repeat(5, 30px); gap:4px; justify-content:center; margin-top:8px; }
  .mq-frame b { width:30px; height:30px; border-radius:50%; border:3px solid #1d2340; background:#fff; }
  .mq-frame b.on { background:#e8443a; }

  /* 30 以內的數：一捆十根＋單根 */
  .mq-sticks { display:flex; justify-content:center; align-items:flex-end; gap:12px; margin-top:8px; }
  .mq-ten, .mq-ones { display:inline-flex; gap:2px; padding:4px; }
  .mq-ten { border:3px solid #e8443a; border-radius:8px; background:#fff3f0; }
  .mq-ten b, .mq-ones b { width:6px; height:52px; background:#f0a800; border-radius:3px; border:1px solid #8a5a00; }
  .mq-ones { gap:6px; }
  /* ===== 情境題（參考評量題型）===== */
  .mq-scene { position:relative; width:min(100%, 440px); height:calc(var(--rows) * 50px); margin:6px auto 0; border-radius:14px; border:3px solid #1d2340; overflow:hidden; }
  .mq-scene { padding:0; } .mq-scene i { position:absolute; transform:translate(-50%, -50%); font-style:normal; }
  .mq-scene .ic { width:42px; height:42px; font-size:32px; }
  .mq-scene.toy { background:#f2c98a; } .mq-scene.garden { background:linear-gradient(#bfe8ff 30%, #a6dd8a 30%); } .mq-scene.pond { background:#8fcdf0; } .mq-scene.party { background:#ffe3a8; }
  .mq-mini { display:flex; flex-wrap:wrap; justify-content:center; gap:1px; max-width:112px; }
  .mq-mini .ic { width:20px; height:20px; font-size:17px; }
  .mq-note { display:inline-flex; align-items:center; gap:6px; margin-top:4px; padding:4px 14px; font-size:1.4rem; font-weight:900; background:#fff8d6; border:2px dashed #b98a00; border-radius:10px; }
  .mq-note .ic { width:36px; height:36px; }
  .mq-rope { width:100%; max-width:120px; height:60px; fill:none; stroke:#a8702a; stroke-width:6; stroke-linecap:round; }
  .mq-road { width:min(100%, 420px); margin-top:4px; fill:none; stroke-width:7; stroke-linecap:round; }
  .mq-road line { stroke:#5a6890; stroke-width:2; stroke-dasharray:5 5; }
  .mq-bars small { font-size:1rem; font-weight:700; color:#5a6890; }
  .mq-stands { display:flex; justify-content:center; gap:22px; margin-top:8px; border-top:3px dashed #5a6890; padding-top:0; }
  .mq-stand { height:124px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
  .mq-stand span { display:flex; align-items:flex-start; }
  .mq-stand .ic { height:100%; width:auto; }
  .mq-stand u { display:block; width:58px; background:#a8702a; border:2px solid #5a3a12; border-radius:4px 4px 0 0; box-sizing:border-box; }
  .mq-books { display:flex; justify-content:center; align-items:flex-end; gap:20px; margin-top:6px; }
  .mq-books span { display:block; border:3px solid #1d2340; border-radius:3px; }
  .mq-rot { display:flex; justify-content:center; align-items:center; gap:18px; height:112px; }
  .mq-rot span { height:24px; line-height:20px; text-align:center; color:#fff; font-weight:900; border:2px solid #1d2340; border-radius:5px; flex-shrink:0; }
  .mq-train { display:flex; justify-content:center; align-items:center; gap:2px; margin-top:8px; flex-wrap:nowrap; }
  .mq-train em { font-style:normal; font-size:1.7rem; }
  .mq-train b { flex:0 1 32px; min-width:0; height:36px; line-height:32px; text-align:center; font-size:.92rem; letter-spacing:-.05em; overflow:hidden; background:#fff3c4; border:2px solid #1d2340; border-radius:6px 6px 10px 10px; }
  .mq-train b.q { background:#ffd6d2; color:#e8443a; }
  .mq-train.down b { border-radius:50%; height:30px; line-height:26px; }
  .mq-rowpick { display:flex; justify-content:center; align-items:center; gap:3px; }
  .mq-rowpick .ic { width:32px; height:32px; font-size:26px; }
  .mq-rowpick i { font-style:normal; filter:grayscale(1) brightness(1.45) opacity(.45); }
  .mq-rowpick i.on { filter:none; }
  .mq-rowpick.two { gap:14px; } .mq-rowpick.two em { font-style:normal; font-weight:900; }
  #battle .bt-choices:has(.mq-rowpick) { grid-template-columns:1fr; }
  #battle .bt-choices:has(.mq-rowpick) button { min-height:52px; }
  .mq-cab { display:flex; justify-content:center; align-items:center; gap:6px; margin-top:4px; }
  .mq-cab em { font-style:normal; font-size:1.8rem; }
  .mq-cab div { display:flex; flex-direction:column; width:90px; border:4px solid #8a5a2b; background:#f2d9b0; border-radius:4px; }
  .mq-cab i { display:flex; justify-content:center; font-style:normal; padding:1px; border-bottom:3px solid #8a5a2b; }
  .mq-cab i:last-child { border-bottom:0; }
  .mq-cab .ic { width:30px; height:30px; font-size:24px; }
  .mq-match { display:grid; grid-template-columns:repeat(var(--n), 1fr); gap:4px 2px; width:min(100%, 420px); margin:8px auto 0; }
  .mq-match i { font-style:normal; height:34px; display:flex; justify-content:center; }
  .mq-match .ic { width:32px; height:32px; font-size:26px; }
  .mq-chart { display:flex; flex-direction:column; gap:3px; width:min(100%, 380px); margin:6px auto 0; }
  .mq-chart div { display:flex; align-items:center; gap:6px; border-bottom:1px solid #c8d4e8; }
  .mq-chart .ic { width:32px; height:32px; font-size:26px; }
  .mq-chart span { display:flex; gap:4px; }
  .mq-chart b { width:20px; height:20px; border:3px solid #2f7de1; border-radius:50%; }
  .mq-box { display:flex; width:min(100%, 320px); height:90px; margin:6px auto 0; border:4px solid #8a5a2b; border-radius:8px; background:#fff; overflow:hidden; }
  .mq-box span { flex:1; display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:2px; padding:3px; }
  .mq-box .ic { width:32px; height:32px; font-size:26px; }
  .mq-box u { flex:1; display:flex; align-items:center; justify-content:center; background:#1d2340; text-decoration:none; font-size:2rem; }
  .mq-toss { display:flex; justify-content:center; align-items:flex-end; gap:18px; margin-top:8px; min-height:100px; }
  .mq-toss .pole { position:relative; width:64px; height:100px; display:flex; flex-direction:column-reverse; align-items:center; gap:2px; padding-bottom:6px; box-sizing:border-box; }
  .mq-toss .pole::before { content:""; position:absolute; left:50%; top:0; bottom:0; width:10px; margin-left:-5px; background:#a8702a; border-radius:5px; }
  .mq-toss .pole b { position:relative; width:52px; height:10px; border:4px solid #e8443a; border-radius:50%; flex-shrink:0; box-sizing:border-box; }
  .mq-toss > span { display:flex; flex-wrap:wrap; gap:3px; max-width:170px; }
  .mq-toss .ic { width:38px; height:38px; font-size:28px; }
  .mq-steamer { position:relative; display:inline-block; width:170px; height:136px; margin:4px auto 0; }
  .mq-steamer > .ic { width:100%; height:100%; object-fit:contain; font-size:7rem; }
  .mq-steamer i { position:absolute; transform:translate(-50%, -50%); font-style:normal; }
  .mq-steamer i .ic { width:48px; height:48px; font-size:36px; }
  .mq-card { display:inline-flex; flex-direction:column; align-items:center; width:62px; min-height:86px; padding:2px; background:#fff; border:2px solid #1d2340; border-radius:8px; color:#1d2340; font-weight:900; line-height:1.1; box-sizing:border-box; }
  .mq-card.red { color:#e8443a; }
  .mq-card b { font-size:1.35rem; }
  .mq-card span { display:block; width:50px; font-size:.92rem; line-height:1.05; text-align:center; white-space:normal; word-break:break-all; }
  .mq-hands { display:flex; justify-content:center; gap:14px; margin-top:6px; }
  .mq-hand { position:relative; display:flex; flex-direction:column; align-items:center; width:140px; }
  .mq-hand small { font-size:1rem; font-weight:700; color:#5a6890; }
  .mq-hand > .ic { width:92px; height:92px; font-size:70px; }
  .mq-hand > span { display:flex; flex-wrap:wrap; justify-content:center; gap:1px; max-width:130px; min-height:26px; font-size:1.5rem; }
  .mq-hand > span .ic { width:24px; height:24px; font-size:20px; }
  /* 手機橫放：「第幾顆」「哪兩籃」的選項排成三欄，題目才有空間 */
  @media (orientation:landscape) and (min-width:600px) and (max-height:520px) {
    #battle .bt-choices:has(.mq-rowpick) { grid-template-columns:repeat(3, 1fr); }
    .mq-rowpick { gap:1px; } .mq-rowpick .ic { width:17px; height:17px; font-size:14px; }
    .mq-rowpick.two { gap:4px; } .mq-rowpick.two .mq-mini { max-width:60px; } .mq-rowpick.two .mq-mini .ic { width:11px; height:11px; font-size:9px; }
  }
</style>
</head>
<body>

<!-- 開始：輸入名字 -->
<section class="screen on" id="start"></section>

<!-- 關卡地圖 -->
<section class="screen" id="map"></section>

<!-- 排行榜 -->
<section class="screen" id="board"></section>

<!-- 對戰（畫面由 shared/battle.js 產生）-->
<section class="screen" id="battle"></section>

<script>
const BASE = '../../';           // 回到專案根目錄
const GAME_ID = 'math-battle';   // 存紀錄用（和注音打怪獸分開）
const TITLE = '🔢 數學打怪獸';
const LEVELS = MathBank.levels();
const $ = id => document.getElementById(id);
let playerName = '';
let backTo = 'start';            // 排行榜按「返回」要回到哪裡

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }

function showStart() {
  show('start');
  Levels.renderStart($('start'), {
    gameId: GAME_ID, title: '數學打怪獸', homeHref: BASE, base: BASE,
    subtitle: '翰林一上 9 單元＋魔王關，一關一隻怪獸！',
    onStart: name => { playerName = name; showMap(); },
    onBoard: () => showBoard('start'),
  });
}

function showMap() {
  show('map');
  Levels.renderMap($('map'), {
    gameId: GAME_ID, name: playerName, base: BASE, levels: LEVELS, title: TITLE,
    onPick: startLevel,
    onSwitch: showStart,
    // 錯題複習：只出這位玩家答錯過的題目
    onReview: () => {
      show('battle');
      Levels.startReview({
        game: GAME_ID, player: playerName, root: $('battle'), base: BASE, moves: ['數字光線', '加法飛踢', '算式火焰拳', '光之斬擊'],
        speech: q => q.speech, answerText: q => q.answerText, onExit: showMap,
      }).then(ok => { if (!ok) showMap(); });
    },
    onBoard: () => showBoard('map'),
  });
}

function showBoard(from) {
  backTo = from;
  show('board');
  Levels.renderBoard($('board'), {
    gameId: GAME_ID, title: TITLE, name: playerName,
    onBack: () => backTo === 'map' ? showMap() : showStart(),
  });
}

function startLevel(i) {
  show('battle');
  Battle.start({
    root: $('battle'),
    level: { no: i + 1, title: LEVELS[i].title, monster: Levels.monster(i, BASE), rules: Levels.TIMING[i] },
    player: Levels.player(BASE, ['數字光線', '加法飛踢', '算式火焰拳', '光之斬擊'], playerName, Levels.getPlayer(GAME_ID, playerName).best + 1),
    nextQuestion: last => MathBank.question(i + 1, last),
    renderQuestion: (q, el) => { el.innerHTML = q.html; },
    speech: q => q.speech,
    answerText: q => q.answerText,
    background: Levels.scene(i, BASE),   // 每一關有自己的場景
    hasNext: i < LEVELS.length - 1,
    isLast: i === LEVELS.length - 1,
    // 每場打完都記錄，結算畫面附上排行榜
    onEnd: r => Levels.recordResult(GAME_ID, playerName, i + 1, r, LEVELS.length),
    // 答錯就記到答錯清單（家長專區可以看，錯題複習會再出）
    onWrong: (q, chosen, chosenText) => Levels.recordWrong(GAME_ID, playerName, i + 1, q, chosen, chosenText, `${q.type}:${q.key}`),
    overExtra: () => `<div class="lb-title">🏆 排行榜</div>${Levels.boardHtml(GAME_ID, playerName, 5)}`,
    onNext: () => startLevel(i + 1),
    onExit: showMap,
  });
}

showStart();
</script>
</body>
</html>
